name: "jfrog-nodegoat"
on:
  workflow_dispatch:
    inputs:
      rt_npm_remote_repo_id:
        required: true
        type: string
        default: "kryptostream-npm-remote"
        description: "Artifactory NPM Repository Name"
      rt_npm_curation_remote_repo_id:
        required: true
        type: string
        default: "kryptostream-npm-curated-dev-remote"
        description: "NPM Curation Repository Name"
      rt_docker_repo:
        required: true
        type: string
        default: "kryptostream-docker-dev-local"
        description: "Artifactory Docker local repository"
      rt_docker_remote_repo:
        required: true
        type: string
        default: "kryptostream-docker-remote"
        description: "Artifactory Docker remote repository (proxies Docker Hub for base image resolution)"
      docker_image_name:
        required: true
        type: string
        default: "nodegoat"
        description: "Docker Image name"
      xr_enable_scan:
        required: true
        type: string
        default: "false"
        description: "Scan with Xray"
      curation_audit:
        required: true
        type: string
        default: "false"
        description: "Audit with Curation"
      xr_override_fail_build:
        required: true
        type: string
        default: "false"
        description: "Set to false to ignore the fail build coming from Xray (exit code 3)"
      cli_log_level:
        required: true
        type: string
        default: "INFO"
        description: "Set JFrog CLI Log level"
      environment_set:
        required: true
        type: string
        default: "solenglatest"
        description: "Environment to use"
  push:
    branches:
      - "feature/**"
      - master
  pull_request:
    branches:
      - feature/**

permissions:
  actions: read
  id-token: write
  packages: write
  contents: read
  security-events: write

jobs:
  build:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment_set || 'solenglatest' }}
    env:
      DOCKER_REPO: ${{ inputs.rt_docker_repo || 'kryptostream-docker-dev-local' }}
      IMAGE_NAME: ${{ inputs.docker_image_name || 'nodegoat' }}
      JFROG_CLI_LOG_LEVEL: ${{ inputs.cli_log_level || 'INFO' }}
    steps:
      - name: Print Inputs
        run: echo "${{ toJSON(github.event.inputs) }}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup JFrog CLI
        uses: jfrog/setup-jfrog-cli@v4
        id: setup-cli
        env:
          JF_URL: ${{ vars.JF_URL }}
          JF_PROJECT: ${{ vars.JF_PROJECT }}
        with:
          oidc-provider-name: ptfl-github
          oidc-audience: ptfl-aud

      - name: Get URI
        id: get-uri
        run: |
          URI=$(echo "${{ vars.JF_URL }}" | awk -F[/:] '{print $4}')
          echo "JF_URI=${URI}" >> $GITHUB_ENV
          echo "JF_URI=${URI}" >> $GITHUB_OUTPUT

      - name: Docker Authenticate
        uses: docker/login-action@v3
        with:
          registry: ${{ vars.JF_URL }}
          username: ${{ steps.setup-cli.outputs.oidc-user }}
          password: ${{ steps.setup-cli.outputs.oidc-token }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: NPM Curation Audit
        working-directory: apps/server-render
        run: |
          if [ ${{ inputs.curation_audit || 'false' }} == 'true' ]; then
            jf npmc --repo-resolve ${{ inputs.rt_npm_curation_remote_repo_id || 'kryptostream-npm-curated-dev-remote' }}
            jf curation-audit
            rm -rf package-lock.json
          else
            echo "Skip Curation Audit!!!"
          fi

      - name: NPM Audit
        working-directory: apps/server-render
        run: |
          npm cache clean --force
          jf npmc --repo-resolve ${{ inputs.rt_npm_remote_repo_id || 'kryptostream-npm-remote' }}
          jf npm ci --loglevel verbose

          if [ ${{ inputs.xr_enable_scan || 'false' }} == 'true' ]; then
            echo "Execute Xray scanning ..."
            jf audit --npm --vuln --fail=${{ inputs.xr_override_fail_build || 'false' }}
          else
            echo "Skip Xray scanning!!!"
          fi

      # jf docker build/push handle build-info collection natively; no separate add-package step needed
      - name: Docker Build
        run: |
          jf docker buildx build \
            --build-name "${{ github.workflow }}" \
            --build-number "${{ github.run_number }}" \
            -f apps/server-render/Dockerfile \
            -t ${{ env.JF_URI }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            --build-arg BASE_IMAGE=${{ steps.get-uri.outputs.JF_URI }}/${{ inputs.rt_docker_remote_repo || 'kryptostream-docker-remote' }}/library/node:18-slim \
            --load \
            apps/server-render

      - name: Docker Push
        run: |
          jf docker push \
            ${{ env.JF_URI }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
            --build-name "${{ github.workflow }}" \
            --build-number "${{ github.run_number }}"

      - name: Docker Scan
        run: |
          if [ ${{ inputs.xr_enable_scan || 'false' }} == 'true' ]; then
            jf docker pull ${{ vars.JF_URL }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ github.run_number }}
            jf docker scan ${{ vars.JF_URL }}/${{ env.DOCKER_REPO }}/${{ env.IMAGE_NAME }}:${{ github.run_number }} \
              --fail=${{ inputs.xr_override_fail_build || 'false' }} --vuln
          else
            echo "Skip Xray scanning!!!"
          fi

      - name: Publish Build Info
        run: |
          jf rt build-collect-env
          jf rt build-add-git
          jf rt build-publish "${{ github.workflow }}" "${{ github.run_number }}"
